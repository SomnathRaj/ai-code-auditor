<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · AI Code Auditor</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-page booting" data-page="auth">
  <main class="auth-card card">
    <div class="brand auth-brand"><span class="brand-mark">◆</span> AI Code Auditor</div>
    <h1>Create your account</h1>
    <form id="auth-form" data-endpoint="/auth/register" novalidate>
      <label>Name <input name="name" autocomplete="name" required maxlength="120"></label>
      <label>Email <input name="email" type="email" autocomplete="email" required></label>
      <label>Organization <input name="organization_name" maxlength="120" placeholder="Optional"></label>
      <label>Password <input name="password" type="password" autocomplete="new-password" required minlength="10">
        <span class="hint">At least 10 characters</span></label>
      <p class="form-error" id="form-error" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>
    <p class="muted small">Already registered? <a href="/login.html">Log in</a></p>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
